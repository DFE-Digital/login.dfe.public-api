openapi: 3.0.1
servers:
  [
    {
      "url": "https://s141d01-signin-papi.azurewebsites.net",
      "description": "DEV server",
    },
    {
      "url": "https://s141d03-signin-papi.azurewebsites.net",
      "description": "TRAN server",
    },
    {
      "url": "https://s141t01-signin-papi.azurewebsites.net",
      "description": "TEST server",
    },
    {
      "url": "https://s141t02-signin-papi.azurewebsites.net",
      "description": "PREPROD server",
    },
    {
      "url": "https://s141p01-signin-papi.azurewebsites.net",
      "description": "PROD server",
    },
  ]
info:
  title: DfE Login Public API
  version: v1
paths:
  /organisations/{ukprn}/users:
    get:
      tags:
        - Organisations
      summary: Get the users of your service at the organisation(s) with a UKPRN or UPIN.
      description: >-
        The value is looked up as a UKPRN first. It is only looked up as a UPIN if no organisation
        has that UKPRN; if a value is the UKPRN of one organisation and the UPIN of another, the
        UKPRN organisation is always used. If organisations are found by UKPRN but none of their
        users have your service, 404 is returned and the UPIN lookup is not tried.

        Users are collected from every organisation that matches (more than one organisation can
        share a UKPRN or UPIN). Only users with access to the calling service (the `iss` of the
        token) are returned. A user with access at more than one matching organisation is returned
        once (matched by email) with their role codes combined; the response does not identify
        which organisation a user or role belongs to.

        `firstName`, `lastName` and `userStatus` describe the user's DfE Sign-in account;
        deactivated accounts (`userStatus` 0) are included.
      parameters:
        - name: ukprn
          in: path
          description: UKPRN or UPIN of the organisation. UKPRN is checked first.
          required: true
          schema:
            type: string
        - name: roles
          in: query
          description: >-
            Comma-separated role codes. Returns users with at least one of these roles at an
            organisation (their other roles at that organisation are still returned). Applied per
            organisation before duplicate users are merged.
          required: false
          schema:
            type: string
        - name: email
          in: query
          description: Return only the user with this email address (case-insensitive).
          required: false
          schema:
            type: string
        - name: userId
          in: query
          description: Return only the user with this DfE Sign-in identifier.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationUsersResponse"
        "400":
          description:
            Request is invalid. Additional details will be provided in the
            response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: JWT is missing or not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: >-
            The token was not accepted (for example unknown issuer, invalid signature or invalid
            audience). The body contains a `message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: >-
            No organisation has this value as a UKPRN or UPIN, or no users with access to your
            service match (including after filters). The body is empty.
        "500":
          description:
            An error occurred on the server. Please ensure that secrets like
            secrets, API keys, or tokens are correctly configured.) If the issue
            still persists, please contact the support team for assistance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /services/{cid}/roles:
    get:
      tags:
        - Services
      summary: Get the roles associated with your service, or one of your child
        services.
      description:
        "Note: If User does not have the specified Service or is not in the
        Organisation stated, it will return status code **404 (Not Found)**."
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesGetRolesForClientResponse"
        "403":
          description:
            The specified client ID is not your service, or a child of your
            service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: No service can be found with the specified client ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /services/{sid}/organisations/{oid}/users/{uid}:
    get:
      tags:
        - Services
      summary: Get a user's access to a service for an organisation.
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: oid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: uid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesGetRolesAndIdentifiersResponse"
        "404":
          description: User does not have the specified Service or is not in the
            Organisation stated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /services:
    post:
      tags:
        - Services
      summary: Create child applications.
      requestBody:
        description: Details of the application.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicesApplicationRequest"
        required: true
      responses:
        "201":
          description: Created
        "202":
          description: Accepted
  /services/{sid}/invitations:
    post:
      tags:
        - Services
      summary: As a service on-boarded to DfE Sign-in, invite users to the service.
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicesInvitationRequest"
        required: true
      responses:
        "202":
          description: Accepted
        "400":
          description:
            Request is invalid. Additional details will be provided in the
            response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: JWT is missing or not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: The service id in the uri does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description:
            An error occurred on the server. Please ensure that secrets like
            secrets, API keys, or tokens are correctly configured.) If the issue
            still persists, please contact the support team for assistance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /users:
    get:
      tags:
        - Users
      summary: Get a list of users of your service.
      description: >-
        Without `status`, `from` or `to`, all users of the calling service are returned (paged).

        If any of `status`, `from` or `to` is provided, results are limited to at most 90 days:
        `from` and `to` more than 90 days apart is rejected with 400; `from` only sets `to` to 90
        days after `from`; `to` only sets `from` to 90 days before `to`; `status` only returns the
        last 90 days. When the API sets a date for you, a `warning` is returned. `dateRange`
        shows the range actually applied.

        Dates are UTC. A date without a time means 00:00:00 at the start of that day, so `to` does
        not include changes made during that day.
      parameters:
        - name: page
          in: query
          description: Optional page number.
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          description: Optional page size.
          schema:
            type: integer
            format: int32
            default: 25
        - name: status
          in: query
          description: >-
            User account status, `1` (active) or `0` (deactivated). Providing it applies the
            90-day date range rules even if no dates are given.
          required: false
          schema:
            type: string
            enum: ["0", "1"]
        - name: from
          in: query
          description: Start date (YYYY-MM-DD, UTC). At most 90 days before `to`.
          required: false
          schema:
            type: string
        - name: to
          in: query
          description: >-
            End date (YYYY-MM-DD, UTC). Treated as 00:00:00 at the start of the day. At most 90
            days after `from`.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersGetPagedUsersResponse"
        "400":
          description: >-
            Invalid query parameter. Date/status filter errors return a plain-text body containing
            one of: `Status is not valid. Should be either 0 or 1.`, `From date is not a valid
            date.`, `To date is not a valid date.`, `From date greater than to date`, `Only 90 days
            are allowed between dates`, or `Date range should not be in the future`. Invalid `page`
            or `pageSize` values return `<value> is not a valid value for <name>. Expected a number`.
          content:
            text/html:
              schema:
                type: string
  /users/approvers:
    get:
      tags:
        - Users
      summary: Get a list of approvers.
      description: >-
        Get a list of approvers for organisations that are within your
        services scope (based on role policy conditions).

        Only available to services with the service setting `canViewApproverReport` set to `true`
        (managed by the DfE Sign-in team). Other services receive 403 with an empty body.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            default: 25
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersGetPagedUsersResponse"
        "400":
          description:
            Request is invalid. Additional details are provided in the response
            body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: JWT is missing or not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: >-
            Empty body: the service does not have the `canViewApproverReport` setting set to `true`.
            JSON body with a `message`: the token was not accepted (for example unknown issuer or
            invalid signature).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "500":
          description:
            An error occurred on the server. Please ensure that secrets like
            secrets, API keys, or tokens are correctly configured. If the issue
            still persists, please contact the support team for assistance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /users/{uid}/organisations:
    get:
      tags:
        - Users
      summary: Get the organisations associated with a user.
      description: >-
        Returns an array of organisations (not wrapped in an object). Organisations with status id
        0 are not returned.
      parameters:
        - name: uid
          in: path
          description: The DfE Sign-in identifier for the user.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserOrganisation"
        "404":
          description: The user has no organisations. The body is empty.
  /users/{uid}/organisationservices:
    get:
      tags:
        - Users
      summary: Get organisations and services for user.
      parameters:
        - name: uid
          in: path
          description: The DfE Sign-in identifier for the user.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersGetOrganisationServicesResponse"
components:
  schemas:
    Identifier:
      type: object
      properties:
        key:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
      additionalProperties: false
    Organisation:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/OrganisationCategory"
        type:
          type: string
          nullable: true
        urn:
          type: string
          nullable: true
        uid:
          type: string
          nullable: true
        ukprn:
          type: string
          nullable: true
        establishmentNumber:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OrganisationStatus"
        closedOn:
          type: string
          format: date-time
          nullable: true
        address:
          type: string
          nullable: true
        phaseOfEducation:
          type: string
          nullable: true
        statutoryLowAge:
          type: integer
          format: int32
          nullable: true
        statutoryHighAge:
          type: integer
          format: int32
          nullable: true
        telephone:
          type: string
          nullable: true
        regionCode:
          type: string
          nullable: true
        legacyId:
          type: string
          nullable: true
        companyRegistrationNumber:
          type: string
          nullable: true
        providerProfileID:
          type: string
          nullable: true
        upin:
          type: string
          nullable: true
        pimsProviderType:
          type: string
          nullable: true
        pimsStatus:
          type: string
          nullable: true
        districtAdministrativeName:
          type: string
          nullable: true
        openedOn:
          type: string
          format: date-time
          nullable: true
        sourceSystem:
          type: string
          nullable: true
        providerTypeName:
          type: string
          nullable: true
        giasProviderType:
          type: string
          nullable: true
        pimsProviderTypeCode:
          type: string
          nullable: true
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
        orgRoleId:
          type: integer
          format: int32
          nullable: true
        orgRoleName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      description: >-
        Organisations are returned as held by DfE Sign-in and currently contain further attributes
        not listed here (for example LegalName, GIASStatus, PIMSStatusName, IsOnAPAR,
        SourceSystem, DistrictAdministrative_code, status.tagColor, and on GET /users the link
        attributes user_id, organisation_id, user_status, user_createdAt and user_updatedAt).
        Attributes for internal DfE Sign-in use should not be relied upon and may be removed in a
        future version.

        Note: on GET /users the organisation is returned in a different, flat shape with
        different attribute names (for example `Category` as a code instead of a `category`
        object, `Status` as a number instead of a `status` object, and `UKPRN` / `URN` / `UPIN`
        in upper case). See the "Service Users without filters" example in the README.
      additionalProperties: true
    UserOrganisation:
      type: object
      description: >-
        An organisation as returned by GET /users/{uid}/organisations. The organisation is returned
        as held by DfE Sign-in, so `type`, `phaseOfEducation` and `region` are objects and some
        attribute names are not camel case. Values that are not known are null. Attributes such as
        `SourceSystem`, `legacyId`, `status.tagColor` and `DistrictAdministrative_code` are for
        internal DfE Sign-in use and should not be relied upon; they may be removed in a future
        version.
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        LegalName:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/OrganisationCategory"
        type:
          $ref: "#/components/schemas/UserOrganisationCodeName"
        urn:
          type: string
          nullable: true
        uid:
          type: string
          nullable: true
        ukprn:
          type: string
          nullable: true
        upin:
          type: string
          nullable: true
        establishmentNumber:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/UserOrganisationStatus"
        closedOn:
          type: string
          format: date-time
          nullable: true
        OpenedOn:
          type: string
          format: date-time
          nullable: true
        address:
          type: string
          nullable: true
        telephone:
          type: string
          nullable: true
        phaseOfEducation:
          $ref: "#/components/schemas/UserOrganisationCodeName"
        statutoryLowAge:
          type: integer
          format: int32
          nullable: true
        statutoryHighAge:
          type: integer
          format: int32
          nullable: true
        region:
          $ref: "#/components/schemas/UserOrganisationCodeName"
        localAuthority:
          $ref: "#/components/schemas/UserOrganisationLocalAuthority"
        DistrictAdministrativeCode:
          type: string
          nullable: true
        DistrictAdministrativeName:
          type: string
          nullable: true
        DistrictAdministrative_code:
          type: string
          nullable: true
        legacyId:
          type: string
          nullable: true
        companyRegistrationNumber:
          type: string
          nullable: true
        SourceSystem:
          type: string
          nullable: true
        providerTypeName:
          type: string
          nullable: true
        ProviderTypeCode:
          type: integer
          format: int32
          nullable: true
        GIASProviderType:
          type: string
          nullable: true
        GIASStatus:
          type: integer
          format: int32
          nullable: true
        GIASStatusName:
          type: string
          nullable: true
        PIMSProviderType:
          type: string
          nullable: true
        PIMSProviderTypeCode:
          type: integer
          format: int32
          nullable: true
        pimsStatus:
          type: integer
          format: int32
          nullable: true
        PIMSStatusName:
          type: string
          nullable: true
        MasterProviderStatusCode:
          type: integer
          format: int32
          nullable: true
        MasterProviderStatusName:
          type: string
          nullable: true
        IsOnAPAR:
          type: string
          nullable: true
      additionalProperties: true
    UserOrganisationCodeName:
      type: object
      nullable: true
      properties:
        id:
          oneOf:
            - type: string
            - type: integer
          nullable: true
        name:
          type: string
          nullable: true
      additionalProperties: false
    UserOrganisationStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        tagColor:
          type: string
          nullable: true
      additionalProperties: false
    UserOrganisationLocalAuthority:
      type: object
      nullable: true
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
      additionalProperties: true
    OrganisationCategory:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
      additionalProperties: false
    OrganisationStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: {}
    Role:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        numericId:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
      additionalProperties: false
    Service:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          nullable: true
      additionalProperties: false
    ServicesApplicationRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true
        client:
          type: string
          nullable: true
        redirectUris:
          type: array
          items:
            type: string
          nullable: true
      additionalProperties: false
    ServicesGetRolesAndIdentifiersResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          nullable: true
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
          nullable: true
      additionalProperties: false
    ServicesGetRolesForClientResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          nullable: true
      additionalProperties: false
    ServicesInvitationRequest:
      required:
        - email
        - family_name
        - given_name
        - sourceId
      type: object
      properties:
        sourceId:
          type: string
          description:
            The identifier of the user in your system. Will be included in back
            channel response.
          nullable: true
        given_name:
          type: string
          description: The users given name.
          nullable: true
        family_name:
          type: string
          description: The user family name.
          nullable: true
        email:
          type: string
          description:
            The email address of the user. This is also a unique identifier of
            a user in DfE Sign-in.
          nullable: true
        organisation:
          type: string
          description: The DfE Sign-in identifier that the user should be associated to.
          nullable: true
        callback:
          type: string
          description:
            The URL that the back channel response should be sent to. See
            details of back channel response below
          nullable: true
        userRedirect:
          type: string
          description:
            The URL that a user, if going through the onboarding, should be
            returned to upon completion. If omitted, the default redirect for
            your client will be used..
          nullable: true
        inviteSubjectOverride:
          type: string
          description: Overrides the subject of the invitation email.
          nullable: true
        inviteBodyOverride:
          type: string
          description: Overrides the content of the invitation email.
          nullable: true
      additionalProperties: false
    User:
      type: object
      properties:
        approvedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        organisation:
          $ref: "#/components/schemas/Organisation"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          nullable: true
        roleName:
          type: string
          nullable: true
        roleId:
          type: integer
          format: int32
        userId:
          type: string
          nullable: true
        userStatus:
          type: integer
          format: int32
        email:
          type: string
          nullable: true
        familyName:
          type: string
          nullable: true
        givenName:
          type: string
          nullable: true
      additionalProperties: false
    UsersGetOrganisationServicesResponse:
      type: object
      properties:
        userId:
          type: string
          nullable: true
        userStatus:
          type: integer
          format: int32
        email:
          type: string
          nullable: true
        familyName:
          type: string
          nullable: true
        givenName:
          type: string
          nullable: true
        organisations:
          type: array
          items:
            $ref: "#/components/schemas/Organisation"
          nullable: true
      additionalProperties: false
    OrganisationUser:
      type: object
      properties:
        email:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        userStatus:
          type: integer
          format: int32
          description: DfE Sign-in account status (1 active, 0 deactivated).
        roles:
          type: array
          description: >-
            Role codes for the calling service, combined across all matching organisations.
          items:
            type: string
      additionalProperties: false
